name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the project was developed there and
        # the failure modes that matter (path separators, console encoding,
        # file locking) are exactly the ones a Linux-only CI hides.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        # Covers the seven red-team suites plus the offline-demo smoke test.
        # No credentials are configured here on purpose: if any test ever starts
        # requiring a key, CI must fail rather than silently skip.
        #
        # XYD_SKILLS_ROOT points at a directory that does not exist, so the
        # optional shared-module delegation is deterministically unavailable —
        # the same shape as a clean clone on any machine. Without this, the
        # result would depend on whether the runner image happens to ship a
        # similar skills directory, and the fallback path would never be run.
        env:
          XYD_SKILLS_ROOT: ${{ runner.temp }}/no-skills
        run: python -m pytest -q

      - name: Publication guard
        # The commit hook is local and bypassable; this is the backstop.
        run: python scripts/check_no_secrets.py --quiet

  demo:
    name: clean-clone demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies only
        run: pip install -r requirements.txt

      - name: Assert no data directory exists
        # The README claims the demo needs no data. Verify the claim, because a
        # demo that quietly depends on a fixture is the usual way this breaks.
        run: test ! -d data

      - name: Run the offline demo
        run: python discipline.py --demo

  publish-gate:
    name: publish gate (full history)
    runs-on: ubuntu-latest
    # Only on push: a contributor's commit email is not ours to police, and
    # failing their PR over it would be noise rather than signal.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate inspects every commit. A shallow clone would hide the old
          # ones and report "clean" for a history that is not -- the most
          # dangerous failure mode this job could have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies only
        run: pip install -r requirements.txt

      - name: Assert the history is safe to publish
        # Identity, credentials, personal paths, forbidden directories, blob size,
        # and the offline demo. See docs/PUBLISHING.md for what each one means.
        run: python scripts/check_public_ready.py --quiet
